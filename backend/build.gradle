plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.6'
    id 'io.spring.dependency-management' version '1.1.6'
    id "org.sonarqube" version "6.0.1.5171"
}

group = 'edu.bbte.licensz.slim2299'
version = 'unspecified'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

apply from: "./lint.gradle"

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web:4.0.6'
    implementation 'org.springframework.boot:spring-boot-starter-validation:4.0.6'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa:4.0.6'
    runtimeOnly 'com.mysql:mysql-connector-j:9.6.0'
    implementation 'com.zaxxer:HikariCP:7.0.2'

    implementation 'org.springframework.boot:spring-boot-starter-security:4.0.6'
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

    implementation 'org.springframework.boot:spring-boot-starter-mail:4.0.6'
    implementation 'com.github.jknack:handlebars:4.5.1'

    compileOnly 'org.projectlombok:lombok:1.18.46'
    annotationProcessor 'org.projectlombok:lombok:1.18.46'
    implementation 'tools.jackson.core:jackson-databind:3.1.2'

    implementation 'org.springframework.boot:spring-boot-starter-actuator:4.0.6'

    implementation 'org.springframework.boot:spring-boot-starter-webflux:4.0.6'

    implementation 'org.modelmapper:modelmapper:3.2.6'
}