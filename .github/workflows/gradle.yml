name: gradle check
on:
    push:
      paths:
        - 'backend/**'
jobs:
    build:
        runs-on: ubuntu-latest
        defaults: 
            run:
                working-directory: ./backend
        steps:
            - name: Checkout
              uses: actions/checkout@v6.0.2

            - name: Set up JDK 21
              uses: actions/setup-java@v5.2.0
              with:
                java-version: '21'
                distribution: 'temurin'
                cache: gradle

            - name: Build with Gradle
              run: ./gradlew build
